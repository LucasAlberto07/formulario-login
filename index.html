
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Login com Modo Escuro</title>
</head>
<body id="body" class="d-flex justify-content-center align-items-center vh-100 bg-light text-dark">

  <div class="position-absolute top-0 end-0 p-3">
    <button id="toggleTheme" class="btn btn-outline-secondary">🌙 Modo Escuro</button>
  </div>

  <div id="card" class="card p-4 shadow bg-white text-dark" style="min-width: 300px;">
    <h1 class="text-center mb-4">Login</h1>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Digite seu email">
        <div class="invalid-feedback">Por favor, insira um email.</div>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
        <div class="invalid-feedback">Por favor, insira sua senha.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const toggleBtn = document.getElementById('toggleTheme');
    const body = document.getElementById('body');
    const card = document.getElementById('card');

    // Alternar tema ao clicar no botão
    toggleBtn.addEventListener('click', () => {
      const darkMode = body.classList.contains('bg-dark');

      if (darkMode) {
        // Voltar para claro
        body.classList.remove('bg-dark', 'text-white');
        body.classList.add('bg-light', 'text-dark');

        card.classList.remove('bg-secondary', 'text-white');
        card.classList.add('bg-white', 'text-dark');

        toggleBtn.innerHTML = '🌙 Modo Escuro';
        toggleBtn.classList.remove('btn-light');
        toggleBtn.classList.add('btn-outline-secondary');
      } else {
        // Modo escuro
        body.classList.remove('bg-light', 'text-dark');
        body.classList.add('bg-dark', 'text-white');

        card.classList.remove('bg-white', 'text-dark');
        card.classList.add('bg-secondary', 'text-white');

        toggleBtn.innerHTML = '☀️ Modo Claro';
        toggleBtn.classList.remove('btn-outline-secondary');
        toggleBtn.classList.add('btn-light');
      }
    });

    // Validação
    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const email = document.getElementById('email');
      const senha = document.getElementById('senha');
      let valid = true;

      if (email.value.trim() === '') {
        email.classList.add('is-invalid');
        valid = false;
      } else {
        email.classList.remove('is-invalid');
      }

      if (senha.value.trim() === '') {
        senha.classList.add('is-invalid');
        valid = false;
      } else {
        senha.classList.remove('is-invalid');
      }

      if (valid) {
        alert('Login enviado com sucesso!');
      }
    });
  </script>

</body>
</html>
